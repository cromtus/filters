hyperspectral_dataset:
  name: Doomer
  input_cameras: ['main']
  split: Doomer.json

warped_gt_dir: PWCNet/

pipeline:
  name: Vanilla
  params:
    spectral_rec_model:
      name: AWAN

optimizer:
  name: Adam
  params:
    lr: 0.0004

training:
  checkpoint_selection: validation_best
  patch_size: 64
  batch_size: 32
  monitor: MAE
  save_every_n_epochs: 30
  n_epochs: 10000
